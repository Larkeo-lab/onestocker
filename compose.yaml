# ใช้ได้สองแบบ
#
# 1. build บนเครื่องแล้วส่งอิมเมจขึ้นไป (make deploy)
#    บน EC2 มีแค่ compose.yaml กับ .env ไม่ต้องมีซอร์สโค้ด
#      docker compose up -d
#
# 2. clone ซอร์สขึ้น EC2 แล้ว build ที่นั่นเลย
#      git pull && docker compose up -d --build
#
#    ระวัง: เครื่อง 1 GB (t3.micro) อาจคอมไพล์ไม่ผ่านเพราะหน่วยความจำไม่พอ
#    ต้องมี swap ก่อน (scripts/setup-ec2.sh ตั้งให้แล้ว)

services:
  api:
    image: one-stocks-api:${TAG:-latest}
    container_name: one-stocks-api

    # มีไว้ให้ `docker compose up --build` ทำงานตอน build บนเครื่องปลายทาง
    # ถ้ามีอิมเมจชื่อข้างบนอยู่แล้ว compose จะใช้ตัวนั้นโดยไม่ build ใหม่
    # สองวิธีจึงอยู่ร่วมกันได้โดยไม่ชนกัน
    build:
      context: .
      dockerfile: Dockerfile

    # ความลับอ่านจาก .env ที่อยู่ข้าง ๆ ไฟล์นี้
    # ไม่ได้ฝังเข้าอิมเมจ อิมเมจตัวเดียวจึงใช้ได้ทุกสภาพแวดล้อม
    env_file: .env

    ports:
      - "${PORT:-8080}:8080"

    # ล้มแล้วขึ้นเองใหม่ รวมถึงตอนเครื่องรีบูต
    restart: unless-stopped

    # กันไม่ให้กินหน่วยความจำทั้งเครื่องถ้าเกิดรั่ว
    # วัดจริงแล้วใช้ราว 15 MB ตอนทำงานหนัก 256 MB จึงเหลือเฟือมาก
    mem_limit: 256m

    # log ไม่จำกัดขนาดจะกินดิสก์ของ EC2 จนเต็มในไม่กี่เดือน
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Cloudflare Tunnel ──────────────────────────────────────
  #
  # ต่อขาออกไปหา Cloudflare แล้วรับ request กลับมาผ่านอุโมงค์นั้น
  # จึงไม่ต้องเปิดพอร์ตขาเข้าบน security group เลย และ IP จริงของ EC2
  # ไม่โผล่ออกอินเทอร์เน็ต
  #
  # ยิงไปที่ http://api:8080 ซึ่งเป็นชื่อ service ในเครือข่ายของ compose
  # ไม่ได้ออกไปนอกเครื่อง การไม่เข้ารหัสช่วงนี้จึงไม่มีความเสี่ยง
  #
  # เปิดใช้เมื่อใส่ CLOUDFLARE_TUNNEL_TOKEN ใน .env แล้วสั่ง
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: one-stocks-tunnel
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    # ใส่ค่าว่างเป็นค่าเริ่มต้น ไม่ใช้ ${VAR:?...} ที่บังคับให้ต้องมี
    # เพราะ compose แทนค่าทั้งไฟล์ก่อนค่อยกรอง profile — ถ้าบังคับไว้
    # การสั่ง `docker compose up -d` ธรรมดาจะพังทั้งที่ไม่ได้ใช้ tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
